name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name "ProSimStudio" `
            --icon "favicon.ico" `
            --add-data "simulator;simulator" `
            --add-data "config;config" `
            --hidden-import "asyncua" `
            --hidden-import "cryptography" `
            --hidden-import "engine" `
            --hidden-import "interfaces" `
            --collect-all "asyncua" `
            --collect-all "engine" `
            --collect-all "interfaces" `
            server.py

      - name: Verify Executable Generated
        shell: powershell
        run: |
          if (Test-Path "dist\ProSimStudio.exe") {
            $bytes = (Get-Item "dist\ProSimStudio.exe").Length
            $mb = $bytes / 1MB
            Write-Host ("Build SUCCESS: dist\ProSimStudio.exe generated ({0:N2} MB)" -f $mb)
          } else {
            Write-Error "Build FAILED: dist\ProSimStudio.exe was not created."
            exit 1
          }

      - name: Upload Executable as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProSimStudio-Windows-x64
          path: dist/ProSimStudio.exe
          if-no-files-found: error
          retention-days: 30
